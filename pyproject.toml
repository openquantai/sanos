[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sanos"
version = "0.1.0"
description = "Standalone SANOS analytics and reproducible WIDB data pipeline."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Hans Buehler" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "cdxcore>=0.1.96,<0.2",
  "click>=8.1,<9",
  "cvxpy>=1.6,<2",
  "filelock>=3.15,<4",
  "highspy>=1.7,<2",
  "numpy>=1.26,<3",
  "pandas-market-calendars>=4.4,<6",
  "polars>=1,<3",
  "pyarrow>=15,<27",
  "scipy>=1.12,<2",
  "threadpoolctl>=3.5,<4",
]

[project.optional-dependencies]
reference = [
  "h5py>=3.10,<4",
  "torch>=2,<3",
]
wrds = [
  "pandas>=2.2,<2.3",
  "psycopg2-binary>=2.9,<3",
  "SQLAlchemy>=2,<2.1",
  "wrds>=3.2,<4",
]
jax = [
  "jax>=0.4,<1",
]
experiment = [
  "h5py>=3.10,<4",
]
operator = [
  "h5py>=3.10,<4",
  "pandas>=2.2,<4",
  "psycopg2-binary>=2.9,<3",
  "SQLAlchemy>=2,<3",
  "torch>=2,<3",
  "wrds>=3.2,<4",
]
test = [
  "h5py>=3.10,<4",
  "jax>=0.4,<1",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]
dev = [
  "build>=1.2,<2",
  "h5py>=3.10,<4",
  "jax>=0.4,<1",
  "mypy>=1.11,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1",
  "wheel>=0.45,<1",
]

[project.scripts]
sanos = "sanos.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["sanos*"]

[tool.setuptools.package-data]
"sanos.resources" = ["*.json", "*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/sanos/model/arbfree.py" = ["E501"]
"src/sanos/model/backbone.py" = ["E501"]
"src/sanos/model/fitter.py" = ["E501"]
"src/sanos/model/jax_fit.py" = ["E501"]
"src/sanos/model/tools.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "scripts"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["h5py.*", "pandas_market_calendars.*", "quantdata.*"]
ignore_missing_imports = true

# These modules are direct compatibility ports of the dynamically typed
# reference numerical implementation.  Runtime and quantitative contracts are
# enforced by the Phase 3 parity/invariant suite; new orchestration, model
# gates, configuration, and data-pipeline code remains under strict mypy.
[[tool.mypy.overrides]]
module = [
  "sanos.model.arbfree",
  "sanos.model.backbone",
  "sanos.model.fitter",
  "sanos.model.tools",
  "sanos.model.tridiag",
]
ignore_errors = true
