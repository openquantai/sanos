[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sanos"
version = "0.1.0"
description = "Standalone SANOS analytics and reproducible WIDB data pipeline."
requires-python = ">=3.12"
authors = [
  { name = "Hans Buehler" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "cdxcore>=0.1.96,<0.2",
  "click>=8.1,<9",
  "cvxpy>=1.6,<2",
  "highspy>=1.7,<2",
  "numpy>=1.26,<3",
  "pandas-market-calendars>=4.4,<6",
  "polars>=1,<3",
  "pyarrow>=15,<27",
  "scipy>=1.12,<2",
]

[project.optional-dependencies]
wrds = [
  "pandas>=2.2,<4",
  "wrds>=3.2,<4",
]
jax = [
  "jax>=0.4,<1",
]
experiment = [
  "h5py>=3.10,<4",
]
test = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1",
  "wheel>=0.45,<1",
]

[project.scripts]
sanos = "sanos.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["sanos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
